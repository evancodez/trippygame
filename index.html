<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Underneath</title>
  <meta name="description" content="You are the hand beneath a sheet of lines. Push and press the fabric to roll a chrome pearl into the eyes, in time with the music. Mouse, keyboard or PS5 controller.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Underneath">
  <meta property="og:description" content="You are the hand beneath the sheet.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="sheet" aria-label="The sheet"></canvas>
  <div id="overlay"></div>
  <div class="drop"><div>drop a song — the sheet will move to it</div></div>
  <input id="songFile" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" hidden>
  <div id="fatal" class="fatal" hidden>Underneath needs WebGL2 — try a recent Chrome, Edge, Firefox or Safari.</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
