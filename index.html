<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sea of Lines</title>
  <meta name="description" content="Ride a chrome pearl across a living op-art sea of lines that swells, rolls into tunnels, grows hands and turns inside out to the music. Keyboard + mouse or PS5 controller.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Sea of Lines">
  <meta property="og:description" content="Ride a pearl across a dream made of lines.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="sea" aria-label="The sea of lines"></canvas>
  <div id="overlay"></div>
  <div class="drop"><div>drop a song — the sea will be cut from it</div></div>
  <input id="songFile" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.flac" hidden>
  <div id="fatal" class="fatal" hidden>Sea of Lines needs WebGL2 — try a recent Chrome, Edge, Firefox or Safari.</div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
